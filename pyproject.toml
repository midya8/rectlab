[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "rectlab-finite"
version = "0.1.0"
description = "Exact finite Boolean rectangle covering evidence"
requires-python = ">=3.10"
license = {text="MIT"}
[project.scripts]
rectlab = "rectlab.__main__:main"
[tool.setuptools]
packages = ["rectlab"]
